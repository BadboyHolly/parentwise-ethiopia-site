name: ParentWise QA Phase 4 Reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-phase4.yml'
      - 'checkout-backend/api/payment_review.py'
      - 'checkout-backend/tests/test_payment_review.py'
      - 'qa-tests/phase4-founder-browser.py'
      - 'checkout-backend/migrations/versions/20261010_03_simulated_reviews.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  simulated-postgres:
    name: PostgreSQL 18 reconciliation and existing API/auth regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: qa_ci
          POSTGRES_DB: pw_qa_disposable
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U qa_ci -d pw_qa_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_disposable
      PW_TEST_POSTGRES_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_disposable
      APP_MODE: qa
      PAYMENTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r checkout-backend/requirements.txt pytest httpx
      - name: Run real PostgreSQL migrations
        working-directory: checkout-backend
        run: alembic upgrade head
      - name: Run simulated reconciliation tests
        working-directory: checkout-backend
        run: PYTHONPATH=. pytest -q tests/test_payment_review.py
      - name: Preserve existing founder and checkout API behavior
        working-directory: checkout-backend
        run: |
          PYTHONPATH=. pytest -q tests/test_admin.py
          PYTHONPATH=. pytest -q tests/test_orders.py

  public-regressions:
    name: Live public QA security and customer browser
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Live anonymous admin security
        run: python qa-tests/admin-public-safety.py
      - name: Live customer checkout regression
        run: python qa-tests/checkout-live-e2e.py

  synthetic-founder-browser:
    name: Synthetic founder desktop/mobile on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: qa_ci
          POSTGRES_DB: pw_qa_disposable
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U qa_ci -d pw_qa_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_disposable
      ORDER_TOKEN_KEY: CI-fixture-key-only-not-deployed-1234567890
      APP_MODE: qa
      PAYMENTS_ENABLED: 'false'
      CREATE_RATE_LIMIT: '100'
      ADMIN_ORIGIN: https://localhost:8443
      FOUNDER_ADMIN_ENABLED: 'true'
      FOUNDER_USERNAME: CI_FICTIONAL_FOUNDER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend, PostgreSQL client and browser
        run: |
          python -m pip install -r checkout-backend/requirements.txt 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Create ephemeral synthetic founder factors
        run: |
          python - <<'PY'
          import os,base64,secrets
          from argon2 import PasswordHasher
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('FOUNDER_PASSWORD_HASH='+PasswordHasher().hash('SyntheticCIOnlyFounderPasswordLong!2026')+'\n')
              f.write('FOUNDER_TOTP_SECRET='+base64.b32encode(secrets.token_bytes(20)).decode()+'\n')
          PY
      - name: Run disposable migrations and temporary localhost HTTPS API
        run: |
          cd checkout-backend
          alembic upgrade head
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/pw-qa-key.pem -out /tmp/pw-qa-cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1
          uvicorn api.main:app --host 127.0.0.1 --port 8443 --no-access-log --ssl-keyfile /tmp/pw-qa-key.pem --ssl-certfile /tmp/pw-qa-cert.pem >/tmp/pw-qa-test-api.log 2>&1 &
          sleep 5
          python ../qa-tests/phase4-founder-browser.py
