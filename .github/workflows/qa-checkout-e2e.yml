name: ParentWise QA checkout acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-checkout-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-checkout:
    name: Desktop and mobile QA checkout (real Render API)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser automation
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run real public HTTPS checkout acceptance
        run: python qa-tests/checkout-live-e2e.py