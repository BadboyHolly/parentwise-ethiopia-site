name: ParentWise checkout gate — five-width acceptance

on:
  push:
    branches:
      - dev/parentwise-checkout-order-gate-20261022
      - checkout/v1-resume-and-release-gates-20261022
      - fix/founder-v1-checkout-20261022
    paths:
      - 'site-preview/order.html'
      - 'production_checkout/app.py'
      - 'production_checkout/tests/**'
      - 'qa-tests/preview_checkout_gate_acceptance.py'
      - '.github/workflows/checkout-gated-preview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-gate-and-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify homepage stays at approved Git blob
        run: |
          test "$(git hash-object site-preview/index.html)" = "9c6ec146adde2f3df5274c5794660a586eb6fc65" # existing two-link CTA routing-only exception; see deploy commit 2b0844
          grep -q "CHECKOUT_OPEN = false" site-preview/order.html
          grep -q "ORDER_API_ORIGIN = ''" site-preview/order.html
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Start public-preview static fixture only
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site-preview >/tmp/pw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/order.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pw-preview.log
          exit 1
      - name: Validate all five widths, synthetic order and recovery
        run: python qa-tests/preview_checkout_gate_acceptance.py

  api-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      ORDER_INTAKE_ENABLED: 'false'
      FOUNDER_APPROVAL_ENABLED: 'false'
      CUSTOMER_PAYMENT_CLAIMS_ENABLED: 'false'
      SECURE_PDF_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend dependencies
        run: python -m pip install -r production_checkout/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Compile order API and test manual journey
        run: |
          python -m compileall -q production_checkout
          python -m pytest -q production_checkout/tests/test_v1_manual_customer_journey.py
