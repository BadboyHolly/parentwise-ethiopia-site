name: Verify deployed ParentWise full website (non-payable preview)

on:
  push:
    branches: [deploy/parentwise-full-site-preview-20261021]
    paths:
      - 'site-preview/**'
      - '.github/workflows/verify-parentwise-preview-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deployed preview pages and branding (READ ONLY)
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for path in / /order.html /assets/logo-reversed.webp /assets/parentwise-primary-horizontal.webp /assets/telebirr-mark.svg /assets/cbe-bank-logo.png /assets/product-workbook.webp /robots.txt; do
            case "$path" in
              /) out=/tmp/pw-home.html ;;
              /order.html) out=/tmp/pw-checkout.html ;;
              /robots.txt) out=/tmp/pw-robots.txt ;;
              *) out=/tmp/pw-$(basename "$path") ;;
            esac
            curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --max-time 20 --output "$out" "$BASE$path"
            echo "200 OK $path (bytes: $(wc -c < "$out"))"
          done
      - name: Wait for the reviewed checkout commit to finish deploying
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --location --silent --show-error --max-time 20 "$BASE/order.html?v=$GITHUB_SHA" -o /tmp/pw-checkout.html &&
               cmp -s site-preview/order.html /tmp/pw-checkout.html; then
              echo "Exact checkout HTML for this GitHub commit received from Render"
              exit 0
            fi
            sleep 5
          done
          echo "Render has not served the exact checkout HTML for this GitHub commit"
          exit 1
      - name: Re-fetch the home page and robots.txt now that the deploy is confirmed
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 --output /tmp/pw-home.html "$BASE/?v=$GITHUB_SHA"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 --output /tmp/pw-robots.txt "$BASE/robots.txt?v=$GITHUB_SHA"
          echo "home bytes: $(wc -c < /tmp/pw-home.html); robots bytes: $(wc -c < /tmp/pw-robots.txt)"
      - name: Validate the live pages (closed order system, approved recipients and price, no external scripts)
        run: python qa-tests/verify_static_release.py /tmp/pw-home.html /tmp/pw-checkout.html /tmp/pw-robots.txt
      - name: Brand assets are present
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ("/tmp/pw-logo-reversed.webp","/tmp/pw-parentwise-primary-horizontal.webp","/tmp/pw-telebirr-mark.svg","/tmp/pw-cbe-bank-logo.png","/tmp/pw-product-workbook.webp"):
              assert Path(path).stat().st_size > 1000, path
          print("PASS: brand assets present")
          PY
