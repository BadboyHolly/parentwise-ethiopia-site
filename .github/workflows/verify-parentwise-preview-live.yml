name: Verify deployed ParentWise full website (non-payable preview)

on:
  push:
    branches: [deploy/parentwise-full-site-preview-20261021]
    paths:
      - 'site-preview/**'
      - '.github/workflows/verify-parentwise-preview-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch deployed preview pages and branding (READ ONLY)
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for path in / /order.html /assets/logo-reversed.webp /assets/telebirr-mark.svg /assets/cbe-bank-logo.png /assets/product-workbook.webp /robots.txt; do
            case "$path" in
              /) out=/tmp/pw-home.html ;;
              /order.html) out=/tmp/pw-checkout.html ;;
              /robots.txt) out=/tmp/pw-robots.txt ;;
              *) out=/tmp/pw-$(basename "$path") ;;
            esac
            curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --max-time 20 --output "$out" "$BASE$path"
            echo "200 OK $path (bytes: $(wc -c < "$out"))"
          done
      - name: Wait for the reviewed checkout commit to finish deploying
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --location --silent --show-error --max-time 20 "$BASE/order.html?v=$GITHUB_SHA" -o /tmp/pw-checkout.html &&
               grep -q 'id="back-telegram"' /tmp/pw-checkout.html &&
               grep -q "back-payment').addEventListener('click',()=>stage(1))" /tmp/pw-checkout.html; then
              echo "Updated checkout received from deployed Render CDN"
              exit 0
            fi
            sleep 5
          done
          echo "Render has not served the matching checkout version"
          exit 1
      - name: Validate full content and no real-payment settings
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path("/tmp/pw-home.html").read_text(encoding="utf-8")
          checkout=Path("/tmp/pw-checkout.html").read_text(encoding="utf-8")
          robots=Path("/tmp/pw-robots.txt").read_text(encoding="utf-8")
          assert len(home)>2000000, "Full embedded sales page not present"
          assert 'href="order.html"' in home, "CTA missing relative checkout path"
          assert 'noindex' in home, "Preview indexing blocker missing"
          assert "CHECKOUT_OPEN = false" in checkout, "Checkout release gate must be closed"
          assert "ORDER_API_ORIGIN = ''" in checkout, "Public preview must have no backend target"
          assert "WALKTHROUGH_ENABLED = true" in checkout, "Non-payable walkthrough missing"
          assert "ትዕዛዝ መቀበል አልተጀመረም" not in checkout, "Unwanted launch banner visible"
          assert 'id="checkout-availability"' not in checkout, "Legacy banner still present"
          assert "Payment: Not requested" in checkout, "Review must never imply completed payment"
          assert "No order was saved" in checkout, "Walkthrough needs payment-stage transparency"
          assert "QA-TELEBIRR-ONLY" not in checkout and "QA-CBE-ONLY" not in checkout, "Obsolete QA accounts leaked"
          assert 'href="./"' in checkout, "Logo back link must not point to QA"
          assert "https://t.me/ParentWiseEthiopia" in checkout, "Configured Telegram destination missing"
          assert "if((!enabled&&!previewOnly)||busy)" in checkout, "Safe order-submission gate missing"
          assert """$('back-payment').addEventListener('click',()=>stage(1))""" in checkout, "Payment back navigation missing"
          assert """$('back-telegram').addEventListener('click',()=>stage(2))""" in checkout, "Telegram back navigation missing"
          assert 'id="back-telegram"' in checkout, "Telegram back button missing"
          for number in ("0912910693","1000223019327","10002230019327"):
            assert number not in home and number not in checkout, "Real payment account publicly exposed"
          assert "Disallow: /" in robots
          for path in ("/tmp/pw-logo-reversed.webp","/tmp/pw-telebirr-mark.svg","/tmp/pw-cbe-bank-logo.png","/tmp/pw-product-workbook.webp"):
            assert Path(path).stat().st_size > 1000, path
          print("PASS LIVE: full sales page + interactive 3-step visual walkthrough, masked recipients, zero real order intake, no indexing")
          PY
