name: Verify ParentWise full website — owner account display

on:
  push:
    branches: [deploy/parentwise-full-site-preview-20261021]
    paths:
      - 'site-preview/**'
      - '.github/workflows/verify-parentwise-preview-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for Render deployment containing founder-approved details
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for i in $(seq 1 35); do
            curl --fail --silent --show-error --location --max-time 15 -o /tmp/pw-checkout.html "$BASE/order.html" || true
            if grep -q '0912910693' /tmp/pw-checkout.html && grep -q '1000223019327' /tmp/pw-checkout.html; then
              echo "PASS Render serves updated recipient copy"
              exit 0
            fi
            sleep 5
          done
          echo "Render did not serve expected checkout revision"
          exit 1
      - name: Fetch deployed pages and required assets
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for path in / /order.html /assets/logo-reversed.webp /assets/telebirr-mark.svg /assets/cbe-bank-logo.png /assets/product-workbook.webp /robots.txt; do
            case "$path" in
              /) out=/tmp/pw-home.html ;;
              /order.html) out=/tmp/pw-checkout.html ;;
              /robots.txt) out=/tmp/pw-robots.txt ;;
              *) out=/tmp/pw-$(basename "$path") ;;
            esac
            curl --fail --location --silent --show-error --max-time 30 -o "$out" "$BASE$path"
            echo "200 OK $path"
          done
      - name: Validate published content, payment accounts and static handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path("/tmp/pw-home.html").read_text(encoding="utf-8")
          checkout=Path("/tmp/pw-checkout.html").read_text(encoding="utf-8")
          robots=Path("/tmp/pw-robots.txt").read_text(encoding="utf-8")
          assert len(home)>2000000
          assert 'href="order.html"' in home
          assert "QA TEST ONLY" not in home
          assert "እውነተኛ ክፍያ አይፈጽሙ" not in home
          assert "ParentWise Ethiopia — Child Behavior & Discipline System" in home
          assert "0912910693" in checkout and "1000223019327" in checkout
          assert "KIDUS ELIAS" in checkout
          assert "10002230019327" not in checkout
          for w in ("DEMO ONLY","QA-TELEBIRR-ONLY","QA-CBE-ONLY","No orders",
                    "DEMO RECIPIENT","ገንዘብ አይላኩ","የሙከራ ገጽ"):
            assert w not in checkout, w
          assert 'href="./"' in checkout
          assert "https://t.me/ParentWiseEthiopia" in checkout
          assert 'fetch(' not in checkout, "Unexpected backend connection: site should remain static until integration approved"
          assert "ይህ ገጽ ብቻውን ትዕዛዝ አያስቀምጥም።" in checkout
          assert 'noindex' in home and "Disallow: /" in robots
          for path in ("/tmp/pw-logo-reversed.webp","/tmp/pw-telebirr-mark.svg","/tmp/pw-cbe-bank-logo.png","/tmp/pw-product-workbook.webp"):
            assert Path(path).stat().st_size > 1000
          print("PASS LIVE: full sales page and checkout, correct owner recipient accounts, clean copy, static Telegram handoff, no backend/automatic order intake")
          PY
