name: Verify deployed ParentWise full website (non-payable preview)

on:
  push:
    branches: [deploy/parentwise-full-site-preview-20261021]
    paths:
      - 'site-preview/**'
      - '.github/workflows/verify-parentwise-preview-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch deployed preview pages and branding (READ ONLY)
        env:
          BASE: https://parentwise-ethiopia-full-website-preview.onrender.com
        run: |
          set -euo pipefail
          for path in / /order.html /assets/logo-reversed.webp /assets/telebirr-mark.svg /assets/cbe-bank-logo.png /assets/product-workbook.webp /robots.txt; do
            case "$path" in
              /) out=/tmp/pw-home.html ;;
              /order.html) out=/tmp/pw-checkout.html ;;
              /robots.txt) out=/tmp/pw-robots.txt ;;
              *) out=/tmp/pw-$(basename "$path") ;;
            esac
            curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --max-time 20 --output "$out" "$BASE$path"
            echo "200 OK $path (bytes: $(wc -c < "$out"))"
          done
      - name: Validate full content and no real-payment settings
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path("/tmp/pw-home.html").read_text(encoding="utf-8")
          checkout=Path("/tmp/pw-checkout.html").read_text(encoding="utf-8")
          robots=Path("/tmp/pw-robots.txt").read_text(encoding="utf-8")
          assert len(home)>2000000, "Full embedded sales page not present"
          assert 'href="order.html"' in home, "CTA missing relative checkout path"
          assert 'noindex' in home, "Preview indexing blocker missing"
          assert "DEMO ONLY" in checkout and "No orders" in checkout, "Non-payable disclaimer missing"
          assert "QA-TELEBIRR-ONLY" in checkout and "QA-CBE-ONLY" in checkout, "Fictional recipients missing"
          assert "DEMO RECIPIENT — NOT REAL" in checkout, "Fake recipient warning missing"
          assert 'href="./"' in checkout, "Logo back link must not point to QA"
          assert "https://t.me/ParentWiseEthiopia" in checkout, "Configured Telegram destination missing"
          assert 'fetch(' not in checkout, "Static review checkout must not submit an order"
          for number in ("0912910693","1000223019327","10002230019327"):
            assert number not in home and number not in checkout, "Real payment account publicly exposed"
          assert "Disallow: /" in robots
          for path in ("/tmp/pw-logo-reversed.webp","/tmp/pw-telebirr-mark.svg","/tmp/pw-cbe-bank-logo.png","/tmp/pw-product-workbook.webp"):
            assert Path(path).stat().st_size > 1000, path
          print("PASS LIVE: complete sales page + linked non-payable checkout + logos, safe recipient placeholders, no order writes, no indexing")
          PY
