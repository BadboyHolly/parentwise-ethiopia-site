name: Checkout preview mobile and safety acceptance

on:
  push:
    branches: ['review/v1-checkout-copy-consistency-20261021']
    paths:
      - order.html
      - assets/telebirr-mark.svg
      - assets/cbe-bank-logo.png
      - qa-tests/checkout-preview-mobile.py
      - .github/workflows/checkout-preview-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Isolated browser preview (no payment or backend API)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Start isolated local static server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/checkout-preview-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/order.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/checkout-preview-http.log
          exit 1
      - name: Validate five viewports, payment switching, images and disabled order
        run: python qa-tests/checkout-preview-mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parentwise-preview-desktop-mobile
          path: qa-artifacts/checkout-preview/*.png
          retention-days: 7
          if-no-files-found: ignore
