name: ParentWise Checkout Branch Acceptance

on:
  push:
    branches:
      - codex/manual-payment-qa-checkout

permissions:
  contents: read

jobs:
  checkout-backend-acceptance:
    name: Backend regressions and disposable PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: qa_ci
          POSTGRES_DB: pw_qa_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_ci -d pw_qa_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_MODE: qa
      PAYMENTS_ENABLED: 'false'
      QA_PG_TESTS: '1'
      DATABASE_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_tests
      PW_TEST_POSTGRES_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_tests
      ORDER_TOKEN_KEY: CI-fixture-key-only-not-deployed-1234567890
      CREATE_RATE_LIMIT: '100'
      FOUNDER_ADMIN_ENABLED: 'true'
      FOUNDER_USERNAME: CI_FICTIONAL_FOUNDER
    steps:
      - name: Check out the checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: codex/manual-payment-qa-checkout
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r checkout-backend/requirements.txt pytest httpx
      - name: Apply migrations to the disposable regression database
        working-directory: checkout-backend
        run: alembic upgrade head
      - name: Run the complete backend regression suite
        working-directory: checkout-backend
        run: PYTHONPATH=. pytest -q tests
      - name: Create a separate disposable migration database
        run: createdb -h localhost -U qa_ci pw_qa_migrations
      - name: Verify migration upgrade, rollback, and re-upgrade
        working-directory: checkout-backend
        env:
          DATABASE_URL: postgresql+psycopg://qa_ci@localhost:5432/pw_qa_migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
