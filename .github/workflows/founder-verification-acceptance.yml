name: ParentWise Founder Verification Acceptance

on:
  pull_request:
    branches:
      - main
      - dev/payment-delivery-state-foundation-20261019
      - dev/founder-payment-verification-20261020
      - feature/aletcloud-manual-telegram-20261023
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/tests/test_journey.py'
      - '.github/workflows/founder-verification-acceptance.yml'
  push:
    branches:
      - dev/founder-payment-verification-20261020
      - feature/aletcloud-manual-telegram-20261023
      - feature/founder-admin-v1-20261023
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/tests/test_journey.py'
      - '.github/workflows/founder-verification-acceptance.yml'

permissions:
  contents: read

jobs:
  founder-payment-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parentwise_ci
          POSTGRES_PASSWORD: disposable_only_password
          POSTGRES_DB: pw_founder_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentwise_ci -d pw_founder_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      ORDER_INTAKE_ENABLED: 'false'
      STAGING_ORDER_INTAKE_ENABLED: 'true'
      FOUNDER_AUTH_ENABLED: 'false'
      FOUNDER_APPROVAL_ENABLED: 'false'
      TEST_DATABASE_URL: postgresql+psycopg://parentwise_ci:disposable_only_password@127.0.0.1:5432/pw_founder_disposable
      STAGING_DATABASE_URL: postgresql+psycopg://parentwise_ci:disposable_only_password@127.0.0.1:5432/pw_staging_disposable
      STAGING_ALLOWED_ORIGINS: https://staging.example.invalid
      TEST_CUSTOMER_RATE_LIMIT: '100'
      PGPASSWORD: disposable_only_password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production and test dependencies
        run: python -m pip install -r production_checkout/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1' 'playwright>=1.50,<2'
      - name: Install Chromium for private founder UI acceptance
        run: python -m playwright install --with-deps chromium
      - name: Create separate staging database
        run: createdb -h 127.0.0.1 -U parentwise_ci pw_staging_disposable
      - name: Generate synthetic staging founder factors
        run: |
          python - <<'PY'
          import base64, os, secrets
          from argon2 import PasswordHasher
          password = secrets.token_urlsafe(32)
          totp = base64.b32encode(secrets.token_bytes(20)).decode().rstrip("=")
          values = {
              "STAGING_ORDER_TOKEN_KEY": secrets.token_urlsafe(48),
              "STAGING_FOUNDER_USERNAME": "ci-founder-" + secrets.token_hex(4),
              "STAGING_FOUNDER_PASSWORD": password,
              "STAGING_FOUNDER_PASSWORD_HASH": PasswordHasher().hash(password),
              "STAGING_FOUNDER_TOTP_SECRET": totp,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print("::add-mask::" + value)
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Apply disposable PostgreSQL migrations
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0002_create_payment_delivery_state.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0003_create_founder_security.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0004_manual_telegram_fulfillment.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f staging_checkout/migrations/0001_stage_sidecar.sql
      - name: Compile production and staging modules
        run: python -m compileall -q production_checkout staging_checkout
      - name: Run full backend and staging regression suite
        run: python -m pytest -q production_checkout/tests staging_checkout/tests/test_journey.py
      - name: Roll back founder migration and verify payment foundation remains
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0004_rollback_manual_telegram_fulfillment.sql
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -c "SELECT to_regclass('production_manual_deliveries') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0003_rollback_founder_security.sql
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -c "SELECT to_regclass('production_orders') IS NOT NULL AND to_regclass('production_payment_fulfillment_state') IS NOT NULL AND to_regclass('production_founder_sessions') IS NULL")" = "t"
      - name: Reapply founder migration and verify schema readiness
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0003_create_founder_security.sql
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -c "SELECT to_regclass('production_founder_sessions') IS NOT NULL")" = "t"
      - name: Reapply manual delivery schema after founder rollback check
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f production_checkout/migrations/0004_manual_telegram_fulfillment.sql
      - name: Backup and restore disposable PostgreSQL database
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -c "INSERT INTO production_orders (id,code,customer_name,mobile_e164,method,amount_etb,currency,status,idempotency_hash,request_fingerprint,access_hash,created_at) VALUES ('qa-backup-order','PW-AAAAAAAAAAAAAAAAAAAAAAAA','Synthetic Backup Parent','+251912345678','telebirr',1500,'ETB','AWAITING_PAYMENT',repeat('a',64),repeat('b',64),repeat('c',64),now())"
          docker run --rm --network host -v "$RUNNER_TEMP:/backup" -e PGPASSWORD="$PGPASSWORD" postgres:16 pg_dump --format=custom --no-owner --no-privileges -h 127.0.0.1 -U parentwise_ci -d pw_founder_disposable -f /backup/parentwise-disposable.dump
          createdb -h 127.0.0.1 -U parentwise_ci pw_restore_disposable
          docker run --rm --network host -v "$RUNNER_TEMP:/backup" -e PGPASSWORD="$PGPASSWORD" postgres:16 pg_restore --exit-on-error --no-owner --no-privileges -h 127.0.0.1 -U parentwise_ci -d pw_restore_disposable /backup/parentwise-disposable.dump
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_restore_disposable -c "SELECT count(*) FROM production_orders WHERE code='PW-AAAAAAAAAAAAAAAAAAAAAAAA' AND status='AWAITING_PAYMENT'")" = "1"
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_restore_disposable -c "SELECT to_regclass('production_manual_deliveries') IS NOT NULL AND to_regclass('production_founder_sessions') IS NOT NULL")" = "t"

