name: Production order intake (isolated, no payments)

on:
  push:
    branches: ['feature/production-checkout-readiness-20261019']
    paths:
      - 'production_checkout/**'
      - '.github/workflows/production-order-intake-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    name: SQLite and PostgreSQL order acceptance (no external payments)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parentwise_ci
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
          POSTGRES_DB: parentwise_disposable_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentwise_ci -d parentwise_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated API and tests
        run: python -m pip install -r production_checkout/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Compile source
        run: python -m compileall -q production_checkout
      - name: Test SQLite with disposable local file
        run: python -m pytest -q production_checkout/tests/test_orders.py
      - name: Test PostgreSQL transaction locks and constraints
        env:
          TEST_DATABASE_URL: postgresql+psycopg://parentwise_ci:ci_only_password_not_a_secret@127.0.0.1:5432/parentwise_disposable_ci
        run: python -m pytest -q production_checkout/tests/test_orders.py
