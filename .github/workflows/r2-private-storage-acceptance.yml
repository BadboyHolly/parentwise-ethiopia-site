name: ParentWise R2 Private Storage Acceptance

on:
  push:
    branches:
      - dev/r2-secure-delivery-20261019
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/**'
      - 'checkout-backend/PRODUCTION-CHECKOUT-CONTRACT.md'
      - '.github/workflows/r2-private-storage-acceptance.yml'

permissions:
  contents: read

jobs:
  immutable-storage-and-backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: parentwise_ci
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
          POSTGRES_DB: pw_r2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentwise_ci -d pw_r2_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      STAGING_ORDER_INTAKE_ENABLED: 'true'
      STAGING_DATABASE_URL: postgresql+psycopg://parentwise_ci:ci_only_password_not_a_secret@127.0.0.1:5432/pw_r2_disposable
      TEST_DATABASE_URL: postgresql+psycopg://parentwise_ci:ci_only_password_not_a_secret@127.0.0.1:5432/pw_orders_disposable
      STAGING_ALLOWED_ORIGINS: https://staging.example.invalid
      TEST_CUSTOMER_RATE_LIMIT: '100'
      PGPASSWORD: ci_only_password_not_a_secret
    steps:
      - name: Check out isolated R2 development branch
        uses: actions/checkout@v4
        with:
          ref: dev/r2-secure-delivery-20261019
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -r production_checkout/requirements.txt 'argon2-cffi>=23.1,<26' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Create separate disposable order database
        run: createdb -h 127.0.0.1 -U parentwise_ci pw_orders_disposable
      - name: Generate ephemeral synthetic founder factors
        run: |
          python - <<'PY'
          import base64, os, secrets
          from argon2 import PasswordHasher
          password = secrets.token_urlsafe(32)
          totp = base64.b32encode(secrets.token_bytes(20)).decode().rstrip("=")
          values = {
              "STAGING_ORDER_TOKEN_KEY": secrets.token_urlsafe(48),
              "STAGING_FOUNDER_USERNAME": "ci-founder-" + secrets.token_hex(4),
              "STAGING_FOUNDER_PASSWORD": password,
              "STAGING_FOUNDER_PASSWORD_HASH": PasswordHasher().hash(password),
              "STAGING_FOUNDER_TOTP_SECRET": totp,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print("::add-mask::" + value)
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Apply checkout and staging schemas to disposable databases
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_orders_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_r2_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_r2_disposable -f staging_checkout/migrations/0001_stage_sidecar.sql
      - name: Compile backend modules
        run: python -m compileall -q production_checkout staging_checkout
      - name: Run complete backend, staging journey, and R2 adapter regression suites
        run: python -m pytest -q production_checkout/tests staging_checkout/tests
