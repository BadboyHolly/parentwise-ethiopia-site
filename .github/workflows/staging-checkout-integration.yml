name: ParentWise Secure Website Delivery — Staging Integration

on:
  push:
    branches:
      - staging/secure-website-delivery-20261019
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/**'
      - '.github/workflows/staging-checkout-integration.yml'
      - 'checkout-backend/PRODUCTION-CHECKOUT-CONTRACT.md'

permissions:
  contents: read

jobs:
  isolated-staging-journey:
    name: Order, fictional payment review, private delivery and abuse controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: parentwise_ci
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
          POSTGRES_DB: pw_staging_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentwise_ci -d pw_staging_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      STAGING_ORDER_INTAKE_ENABLED: 'true'
      STAGING_DATABASE_URL: postgresql+psycopg://parentwise_ci:ci_only_password_not_a_secret@127.0.0.1:5432/pw_staging_disposable
      STAGING_ALLOWED_ORIGINS: https://127.0.0.1:8443
      STAGING_CUSTOMER_RATE_LIMIT: '30'
      PGPASSWORD: ci_only_password_not_a_secret
    steps:
      - name: Check out isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: staging/secure-website-delivery-20261019
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent checkout and staging test dependencies
        run: python -m pip install -r production_checkout/requirements.txt 'argon2-cffi>=23.1,<26' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Generate ephemeral synthetic founder factors and token keys
        run: |
          python - <<'PY'
          import base64, os, secrets
          from argon2 import PasswordHasher
          password = secrets.token_urlsafe(32)
          totp = base64.b32encode(secrets.token_bytes(20)).decode().rstrip("=")
          values = {
              "STAGING_ORDER_TOKEN_KEY": secrets.token_urlsafe(48),
              "STAGING_FOUNDER_USERNAME": "ci-founder-" + secrets.token_hex(4),
              "STAGING_FOUNDER_PASSWORD": password,
              "STAGING_FOUNDER_PASSWORD_HASH": PasswordHasher().hash(password),
              "STAGING_FOUNDER_TOTP_SECRET": totp,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print("::add-mask::" + value)
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Run independent order API acceptance on a second disposable database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://parentwise_ci:ci_only_password_not_a_secret@127.0.0.1:5432/pw_orders_disposable
        run: |
          createdb -h 127.0.0.1 -U parentwise_ci pw_orders_disposable
          python -m pytest -q production_checkout/tests/test_orders.py
      - name: Apply order and isolated staging sidecar schemas
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f staging_checkout/migrations/0001_stage_sidecar.sql
      - name: Compile isolated checkout modules
        run: python -m compileall -q production_checkout staging_checkout
      - name: Run complete staging order-to-download and abuse-protection journey
        run: python -m pytest -q staging_checkout/tests/test_journey.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Start isolated HTTPS staging API
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/stage-key.pem -out /tmp/stage-cert.pem -days 1 -subj "/CN=127.0.0.1"
          STAGING_CUSTOMER_RATE_LIMIT=500 nohup python -m uvicorn staging_checkout.runtime:app --host 0.0.0.0 --port 8443 --ssl-keyfile /tmp/stage-key.pem --ssl-certfile /tmp/stage-cert.pem > artifacts-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:8443/staging/healthz; then
              break
            fi
            sleep 1
          done
      - name: Run browser acceptance at mobile and desktop viewports
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m pytest -v staging_checkout/tests/test_browser_acceptance.py 2>&1 | tee artifacts/browser-test.log
      - name: Upload browser screenshots, dummy downloads and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parentwise-staging-browser-acceptance
          path: |
            artifacts/
            artifacts-server.log
          if-no-files-found: warn
          retention-days: 14
