name: Lead capture checkout checks (dormant by default)

on:
  push:
    branches:
      - claude/lead-capture-checkout-20261107
    paths:
      - 'site-preview/order.html'
      - 'site-preview/assets/js/pw-lead.js'
      - 'qa-tests/lead_capture_checkout.py'
      - 'qa-tests/verify_static_release.py'
      - '.github/workflows/lead-capture-checkout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-lead-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static release safety checks still pass (closed order system, no backend address, no external scripts)
        run: python qa-tests/verify_static_release.py site-preview/index.html site-preview/order.html site-preview/robots.txt
      - name: Install Playwright Python and use runner-provided Chrome
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          google-chrome --version
      - name: Dormant by default, exact payloads when enabled, failures never block checkout
        run: python qa-tests/lead_capture_checkout.py
