name: V1 manual Telegram pending-order smoke acceptance (isolated)
on:
  push:
    branches: [dev/v1-pending-order-integration-20261021]
    paths:
      - 'production_checkout/**'
      - 'v1_checkout/**'
      - 'qa-tests/v1-manual-checkout-api-integration.py'
      - '.github/workflows/v1-manual-pending-order-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-order-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      ORDER_INTAKE_ENABLED: 'false'
      CUSTOMER_PAYMENT_CLAIMS_ENABLED: 'false'
      FOUNDER_APPROVAL_ENABLED: 'false'
      SECURE_PDF_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r production_checkout/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Compile independent pending-order API
        run: python -m compileall -q production_checkout
      - name: Run synthetic V1 order/no-payment tests
        run: python -m pytest -q production_checkout/tests/test_v1_manual_customer_journey.py
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Start localhost-only fake account intake server
        env:
          V1_SYNTHETIC_CI: 'true'
        run: |
          uvicorn v1_checkout.ci_server:app --host 127.0.0.1 --port 8765 >/tmp/pw-v1-ci.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8765/healthz -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pw-v1-ci.log
          exit 1
      - name: Verify form submission and pending order persistence
        run: python qa-tests/v1-manual-checkout-api-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-synthetic-pending-order-screenshots
          path: qa-artifacts/v1-pending-intake/*.png
          retention-days: 5
