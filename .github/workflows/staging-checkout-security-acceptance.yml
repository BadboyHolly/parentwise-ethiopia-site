name: ParentWise STEP 6.4A Staging Checkout Acceptance

on:
  push:
    branches:
      - dev/staging-checkout-security-20261020
      - dev/staging-checkout-ux-20261020
      - dev/staging-checkout-final-simplicity-20261020
      - dev/staging-checkout-buyer-first-ux-20261020
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/**'
      - '.github/workflows/staging-checkout-security-acceptance.yml'
      - 'docs/STEP-6.4B-R2-AND-FOUNDER-RUNBOOK.md'
      - 'docs/STEP-6.4A-ENGLISH-COPY-REVIEW.md'
      - 'docs/STEP-6.4A-5-PARENT-USABILITY-TEST.md'
      - 'docs/STEP-6.4A.2-SETTLEMENT-VERIFICATION-FEASIBILITY.md'
  pull_request:
    branches:
      - dev/secure-pdf-delivery-20261020
      - dev/staging-checkout-security-20261020
      - dev/staging-checkout-ux-20261020
      - dev/staging-checkout-final-simplicity-20261020
    paths:
      - 'production_checkout/**'
      - 'staging_checkout/**'
      - '.github/workflows/staging-checkout-security-acceptance.yml'
      - 'docs/STEP-6.4B-R2-AND-FOUNDER-RUNBOOK.md'
      - 'docs/STEP-6.4A-ENGLISH-COPY-REVIEW.md'
      - 'docs/STEP-6.4A-5-PARENT-USABILITY-TEST.md'
      - 'docs/STEP-6.4A.2-SETTLEMENT-VERIFICATION-FEASIBILITY.md'

permissions:
  contents: read

jobs:
  backend-and-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: parentwise_ci
          POSTGRES_PASSWORD: disposable_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentwise_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_MODE: staging
      PAYMENTS_ENABLED: 'false'
      ORDER_INTAKE_ENABLED: 'false'
      CUSTOMER_PAYMENT_CLAIMS_ENABLED: 'false'
      SECURE_PDF_DELIVERY_ENABLED: 'false'
      FOUNDER_AUTH_ENABLED: 'false'
      FOUNDER_APPROVAL_ENABLED: 'false'
      PRODUCTION_ORDER_INTAKE_ENABLED: 'false'
      STAGING_ORDER_INTAKE_ENABLED: 'true'
      TEST_DATABASE_URL: postgresql+psycopg://parentwise_ci:disposable_only_password@127.0.0.1:5432/pw_production_disposable
      STAGING_DATABASE_URL: postgresql+psycopg://parentwise_ci:disposable_only_password@127.0.0.1:5432/pw_staging_disposable
      STAGING_ALLOWED_ORIGINS: https://127.0.0.1:8443
      STAGING_BROWSER_URL: https://127.0.0.1:8443
      TEST_CUSTOMER_RATE_LIMIT: '100'
      STAGING_CUSTOMER_RATE_LIMIT: '100'
      PGPASSWORD: disposable_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and browser-test dependencies
        run: |
          python -m pip install -r staging_checkout/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1' 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Generate synthetic founder and staging secrets
        run: |
          python - <<'PY'
          import base64, os, secrets
          from argon2 import PasswordHasher
          password = secrets.token_urlsafe(32)
          totp = base64.b32encode(secrets.token_bytes(20)).decode().rstrip("=")
          values = {
              "STAGING_ORDER_TOKEN_KEY": secrets.token_urlsafe(48),
              "STAGING_FOUNDER_USERNAME": "ci-founder-" + secrets.token_hex(4),
              "STAGING_FOUNDER_PASSWORD": password,
              "STAGING_FOUNDER_PASSWORD_HASH": PasswordHasher().hash(password),
              "STAGING_FOUNDER_TOTP_SECRET": totp,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print("::add-mask::" + value)
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Create disposable PostgreSQL databases
        run: |
          createdb -h 127.0.0.1 -U parentwise_ci pw_production_disposable
          createdb -h 127.0.0.1 -U parentwise_ci pw_staging_disposable
      - name: Apply production regression and isolated staging migrations
        run: |
          for migration in 0001_create_orders.sql 0002_create_payment_delivery_state.sql 0003_create_founder_security.sql 0004_create_customer_rate_limits.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -f "production_checkout/migrations/$migration"
          done
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f production_checkout/migrations/0001_create_orders.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_staging_disposable -f staging_checkout/migrations/0001_stage_sidecar.sql
      - name: Compile Python sources
        run: python -m compileall -q production_checkout staging_checkout
      - name: Run complete backend and disposable PostgreSQL regression suite
        run: python -m pytest -q production_checkout/tests staging_checkout/tests/test_journey.py
      - name: Roll back and re-upgrade founder/customer migrations
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -f production_checkout/migrations/0004_rollback_customer_rate_limits.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -f production_checkout/migrations/0003_rollback_founder_security.sql
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -c "SELECT to_regclass('production_customer_rate_limits') IS NULL AND to_regclass('production_founder_sessions') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -f production_checkout/migrations/0003_create_founder_security.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -f production_checkout/migrations/0004_create_customer_rate_limits.sql
          test "$(psql -At -h 127.0.0.1 -U parentwise_ci -d pw_production_disposable -c "SELECT to_regclass('production_founder_sessions') IS NOT NULL AND to_regclass('production_customer_rate_limits') IS NOT NULL")" = "t"
      - name: Create local TLS certificate for isolated browser test
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/staging.key" -out "$RUNNER_TEMP/staging.crt" -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
      - name: Start local isolated staging app
        run: |
          nohup python -m uvicorn staging_checkout.app:from_environment --factory --host 127.0.0.1 --port 8443 --ssl-keyfile "$RUNNER_TEMP/staging.key" --ssl-certfile "$RUNNER_TEMP/staging.crt" > "$RUNNER_TEMP/staging-app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/staging-app.pid"
          for attempt in $(seq 1 40); do
            if curl --insecure --fail https://127.0.0.1:8443/staging/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/staging-app.log"
          exit 1
      - name: Run real-browser checkout journey, mobile widths, recovery, and security cases
        run: python -m pytest -q staging_checkout/tests/test_browser_acceptance.py
      - name: Upload browser screenshots, dummy-download checks, and CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-6-4a-staging-browser-evidence
          path: |
            artifacts/**
            ${{ runner.temp }}/staging-app.log
          if-no-files-found: warn
          retention-days: 14
