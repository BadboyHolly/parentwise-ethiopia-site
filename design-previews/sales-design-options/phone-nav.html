<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF navigation options</title>
<style>
@font-face{font-family:ParentWise;src:url(assets/fonts/inter-400.woff2) format("woff2");font-weight:400;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:ParentWise;src:url(assets/fonts/inter-600.woff2) format("woff2");font-weight:600;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:ParentWise;src:url(assets/fonts/inter-700.woff2) format("woff2");font-weight:700;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:ParentWise;src:url(assets/fonts/parentwise-font-01.woff2) format("woff2");font-weight:400 700;unicode-range:U+1200-139F,U+2D80-2DDF}
*{box-sizing:border-box}body{margin:0;background:#F8F4EC;font-family:ParentWise,"Noto Sans Ethiopic",system-ui,sans-serif;color:#202928}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lab{background:#7A2E3E;color:#fff;font:700 13px/1.4 ParentWise,sans-serif;padding:10px 14px}.lab small{display:block;font-weight:400;opacity:.92}
.sec{max-width:430px;margin:0 auto;background:#EEF3EF;padding:12px 0 18px;overflow:hidden}
.stg{position:relative}
.dev{position:relative;width:250px;margin:0 auto;background:#16201c;border-radius:30px;padding:5px;box-shadow:0 26px 34px -22px rgba(31,77,58,.75)}
.dev:before{content:"";position:absolute;top:11px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#0b110e;z-index:6}
.vw{position:relative;overflow:hidden;border-radius:25px;background:#f1eadb;aspect-ratio:9/16;touch-action:pan-y;user-select:none;cursor:grab}
.trk{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.8,.2,1)}.vw.drag .trk{transition:none}
.trk img{flex:0 0 100%;width:100%;height:100%;display:block;pointer-events:none;object-fit:cover}
.pn{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);padding:4px 10px;border-radius:999px;background:rgba(32,41,40,.85);color:#fff;font:700 11px/1 ParentWise,sans-serif;white-space:nowrap}
.pk{position:absolute;top:30%;width:150px;border:0;padding:0;background:none;z-index:1;opacity:.7}.pk img{width:100%;display:block;border-radius:12px;background:#fff}
.pk.l{right:calc(50% + 107px)}.pk.r{left:calc(50% + 107px)}.pk[hidden]{display:none}
.ctl{display:flex;gap:8px;align-items:center;margin:12px 14px 0}
.arr{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid #1F4D3A;background:#fff;color:#1F4D3A;display:grid;place-items:center}.arr[disabled]{opacity:.3}
.rb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:0;background:#1F4D3A;color:#fff;font:700 15px/1.2 ParentWise,sans-serif}
/* NAV 1: guide tabs + dots */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 12px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:6px 4px;border-radius:14px;border:1.5px solid #1F4D3A;background:#fff;color:#1F4D3A;font:700 13.5px/1.2 ParentWise,sans-serif}
.chip small{font:600 11px/1 ParentWise,sans-serif;color:#56645d}
.chip.on{background:#1F4D3A;color:#fff}.chip.on small{color:#cfe0d6}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}.dots i{width:7px;height:7px;border-radius:50%;background:#c3d2c8;transition:.25s}.dots i.on{width:22px;border-radius:5px;background:#7A2E3E}
.ttl{margin:10px 14px 0;text-align:center;font:700 16px/1.45 ParentWise,sans-serif;color:#1F4D3A}
/* NAV 2: thumbnail strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 6px;margin-top:12px;scrollbar-width:none;align-items:flex-end}.strip::-webkit-scrollbar{display:none}
.grp{flex:none;display:flex;flex-direction:column;gap:5px}
.grp .gl{font:700 11px/1 ParentWise,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#56645d;padding-left:2px}.grp.on .gl{color:#7A2E3E}
.grp .th{display:flex;gap:5px}
.th button{flex:none;width:44px;padding:0;border:2px solid transparent;border-radius:8px;background:#fff;overflow:hidden;opacity:.65;transition:.2s}
.th button img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.th button.on{border-color:#7A2E3E;opacity:1;transform:translateY(-3px);box-shadow:0 8px 12px -6px rgba(0,0,0,.5)}
.ov{position:fixed;inset:0;z-index:999;background:#0e1411;display:none}.ov.show{display:block}
.ov .x{position:absolute;top:8px;right:8px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:28px;z-index:3}
.ov .sc{position:absolute;inset:0;overflow:auto;padding:60px 0 20px}.ov .sc img{display:block;width:230%;max-width:none}.ov .t{position:absolute;left:16px;top:18px;color:#fff;font:700 14px/1.4 ParentWise,sans-serif;z-index:2}
</style></head><body>
<div class="lab">NAV 1: guide tabs + page dots<small>3 big tabs on top (Quick Help, Workbook, 30-Day) jump to that PDF. Dots show the page inside it.</small></div>
<section class="sec" id="n1"></section>
<div class="lab">NAV 2: thumbnail strip<small>All 8 real pages as tiny thumbnails, grouped by PDF. Tap any thumbnail to jump straight to it.</small></div>
<section class="sec" id="n2"></section>
<div class="ov"><button class="x" aria-label="ዝጋ">×</button><div class="t"></div><div class="sc"><img alt=""></div></div>
<script>
var G=[{n:'Quick Help',p:[['quickhelp-1','ልጄ «እምቢ» ሲለኝ'],['quickhelp-2','ምን ማለትና ምን ማስወገድ']]},{n:'Workbook',p:[['workbook-1','የመረጋጋት ዕቅድ'],['workbook-2','ሳምንታዊ መከታተያ'],['workbook-3','የባህሪ መርማሪ']]},{n:'30-Day',p:[['30day-1','የ30 ቀን ካርታ'],['30day-2','የሳምንት 1 ልምምድ'],['30day-3','የመሻሻል መከታተያ']]}];
var P=[];G.forEach(function(g,gi){g.p.forEach(function(p,i){P.push({gi:gi,g:g.n,i:i,len:g.p.length,f:p[0],l:p[1]})})});
var sm=function(f){return 'assets/img/preview/'+f+'-sm.webp'},big=function(f){return 'assets/img/preview/'+f+'.webp'};
var MG='<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5M8 10.5h5M10.5 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var LA='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',RA=LA.replace('M15 6l-6 6 6 6','M9 6l6 6-6 6');
var ov=document.querySelector('.ov');function open_(n){ov.classList.add('show');document.body.style.overflow='hidden';ov.querySelector('img').src=big(P[n].f);ov.querySelector('.t').textContent=P[n].g+' · ገጽ '+(P[n].i+1)+'/'+P[n].len;ov.querySelector('.sc').scrollTo(0,0)}
ov.querySelector('.x').onclick=function(){ov.classList.remove('show');document.body.style.overflow=''};
function build(root,mode){var cur=0;
var top=mode===1?'<div class="chips">'+G.map(function(g,k){return '<button class="chip" data-g="'+k+'">'+g.n+'<small>'+g.p.length+' ገጾች</small></button>'}).join('')+'</div>':'';
root.innerHTML=top+'<div class="stg"><button class="pk l" hidden><img alt=""></button><button class="pk r" hidden><img alt=""></button><div class="dev"><div class="vw"><div class="trk"></div><span class="pn"></span></div></div></div>'+(mode===1?'<div class="dots"></div><div class="ttl"></div>':'<div class="strip">'+G.map(function(g,k){var h='<div class="grp" data-g="'+k+'"><span class="gl">'+g.n+'</span><div class="th">';P.forEach(function(p,n){if(p.gi===k)h+='<button data-n="'+n+'" aria-label="'+p.g+' '+(p.i+1)+'"><img src="'+sm(p.f)+'" alt=""></button>'});return h+'</div></div>'}).join('')+'</div>')+'<div class="ctl"><button class="arr l" aria-label="ቀዳሚ">'+LA+'</button><button class="rb">'+MG+'<span>ገጹን ይክፈቱና ያንብቡ</span></button><button class="arr r" aria-label="ቀጣይ">'+RA+'</button></div>';
var vw=root.querySelector('.vw'),trk=root.querySelector('.trk'),pv=root.querySelector('.arr.l'),nx=root.querySelector('.arr.r'),pl=root.querySelector('.pk.l'),pr=root.querySelector('.pk.r');
P.forEach(function(p){var im=new Image();im.src=sm(p.f);im.alt=p.l;im.draggable=false;trk.appendChild(im)});
function pk(el,n){if(n<0||n>=P.length){el.hidden=true;return}el.hidden=false;el.querySelector('img').src=sm(P[n].f)}
function go(n){n=Math.max(0,Math.min(P.length-1,n));cur=n;var p=P[n];trk.style.transform='translateX('+(-n*100)+'%)';root.querySelector('.pn').textContent='ገጽ '+(p.i+1)+' / '+p.len;pv.disabled=n===0;nx.disabled=n===P.length-1;pk(pl,n-1);pk(pr,n+1);
if(mode===1){root.querySelectorAll('.chip').forEach(function(c,k){c.classList.toggle('on',k===p.gi)});root.querySelector('.dots').innerHTML=Array.from({length:p.len},function(_,k){return '<i class="'+(k===p.i?'on':'')+'"></i>'}).join('');root.querySelector('.ttl').textContent=p.l}
else{root.querySelectorAll('.grp').forEach(function(g,k){g.classList.toggle('on',k===p.gi)});root.querySelectorAll('.th button').forEach(function(b){b.classList.toggle('on',+b.dataset.n===n)});var a=root.querySelector('.th button.on');if(a)root.querySelector('.strip').scrollTo({left:a.offsetLeft-100,behavior:'smooth'})}}
pv.onclick=pl.onclick=function(){go(cur-1)};nx.onclick=pr.onclick=function(){go(cur+1)};root.querySelector('.rb').onclick=function(){open_(cur)};
root.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){var k=+c.dataset.g;go(P.findIndex(function(p){return p.gi===k}))}});
root.querySelectorAll('.th button').forEach(function(b){b.onclick=function(){go(+b.dataset.n)}});
var sx,sy,dx=0,down=false,drag=false,t0;vw.addEventListener('pointerdown',function(e){down=true;drag=false;sx=e.clientX;sy=e.clientY;dx=0;t0=Date.now()});
vw.addEventListener('pointermove',function(e){if(!down)return;var mx=e.clientX-sx,my=e.clientY-sy;if(!drag){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;vw.classList.add('drag');try{vw.setPointerCapture(e.pointerId)}catch(_){}}else return}dx=mx;var edge=(cur===0&&dx>0)||(cur===P.length-1&&dx<0);trk.style.transform='translateX(calc('+(-cur*100)+'% + '+(edge?dx*.25:dx)+'px))'});
function end(e){if(!down)return;down=false;vw.classList.remove('drag');var w=vw.clientWidth,v=Math.abs(dx)/Math.max(1,Date.now()-t0);if(drag){if(Math.abs(dx)>w*.2||v>.5)go(cur+(dx<0?1:-1));else go(cur)}else if(e&&e.type==='pointerup')open_(cur);drag=false}
vw.addEventListener('pointerup',end);vw.addEventListener('pointercancel',function(){end(null)});go(0)}
build(document.getElementById('n1'),1);build(document.getElementById('n2'),2);
</script></body></html>
